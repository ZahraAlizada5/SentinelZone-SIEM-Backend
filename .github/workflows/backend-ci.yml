name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install tested dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Scan repository source tree
        run: python scripts/check_secrets.py --root .
      - name: Full isolated SQLite acceptance and pytest
        run: python scripts/acceptance.py

  postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Disposable CI service only: no real credentials or external integration.
    # Loopback trust is confined to this ephemeral runner; never copy to deployment.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sentinelzone_ci_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: .
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/sentinelzone_ci_test
      PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install matching PostgreSQL backup clients
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
      - name: Install tested dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Guarded PostgreSQL migrations, backup, concurrency and full pytest
        run: python scripts/acceptance.py --postgres --allow-test-db-reset
